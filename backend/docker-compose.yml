services:
  postgres:
    image: postgres:15
    container_name: controlis_postgres
    environment:
      POSTGRES_DB: controlis
      POSTGRES_USER: controlis
      POSTGRES_PASSWORD: controlis
    ports:
      - "5432:5432"
    volumes:
      - controlis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlis -d controlis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - controlis_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlis_backend
    environment:
      DATABASE_URL: postgresql+psycopg://controlis:controlis@postgres:5432/controlis
      SECRET_KEY: change-me-controlis-secret-key-2026
      FRONTEND_ORIGIN: http://localhost:3000
      API_V1_PREFIX: /api/v1
      ENVIRONMENT: local
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      LOW_STOCK_THRESHOLD: 10
      ALGORITHM: HS256
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - controlis_network
    restart: unless-stopped

volumes:
  controlis_postgres_data:
    name: controlis_postgres_data

networks:
  controlis_network:
    name: controlis_network
